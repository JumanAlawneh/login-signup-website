
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxe Bags | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #080808, #242017, #080808);
            color: white;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            background: rgba(15, 15, 15, 0.96);
            border: 1px solid #c9a44c;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(201, 164, 76, 0.15);
        }

        .logo {
            text-align: center;
            color: #d4af57;
            font-family: Georgia, serif;
            font-size: 34px;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #bcbcbc;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e4c675;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #51472f;
            border-radius: 7px;
            background: #1c1c1c;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #d4af57;
        }

        .login-btn,
        .google-btn {
            width: 100%;
            padding: 13px;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn {
            border: none;
            background: linear-gradient(90deg, #b18a35, #f0d78b);
            color: #111;
            margin-bottom: 16px;
        }

        .login-btn:hover {
            background: #fff0b5;
            transform: translateY(-2px);
        }

        .forgot {
            display: block;
            text-align: right;
            color: #d4af57;
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .forgot:hover,
        .signup a:hover {
            color: white;
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #888;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #414141;
        }

        .google-btn {
            background: #fff;
            color: #222;
            border: none;
            margin-bottom: 25px;
        }

        .google-btn:hover {
            background: #e9e9e9;
        }

        .signup {
            text-align: center;
            font-size: 14px;
            color: #bcbcbc;
        }

        .signup a {
            color: #d4af57;
            text-decoration: none;
            font-weight: bold;
            margin-left: 4px;
        }

        .message {
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
            color: #f0d78b;
        }

        @media (max-width: 400px) {
            .login-box {
                padding: 30px 22px;
            }

            .logo {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1 class="logo">LUXE BAGS</h1>
        <p class="subtitle">Luxury in every detail.</p>

        <form id="loginForm">

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="login-btn">LOGIN</button>

        </form>

        <p id="message" class="message"></p>

        <a href="reset_password.html" class="forgot">
            Forgot Password?
        </a>

        <div class="divider">OR</div>

        <button type="button" class="google-btn" id="googleBtn">
            Continue with Google
        </button>

        <p class="signup">
            Don't have an account?
            <a href="https://jumanalawneh.github.io/luxe-bags/signup.html">
                Sign Up
            </a>
        </p>

    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            const savedEmail = localStorage.getItem("userEmail");
            const savedPassword = localStorage.getItem("userPassword");

            if (email === savedEmail && password === savedPassword) {
                message.textContent = "Login successful!";

                setTimeout(function() {
                    window.location.href = "home.html";
                }, 700);

            } else {
                message.textContent =
                    "Invalid email or password. Please sign up first.";
            }
        });

        document.getElementById("googleBtn").addEventListener("click", function() {
            message.textContent =
                "Google login needs Google Identity Services setup.";
        });
    </script>

</body>
</html>
