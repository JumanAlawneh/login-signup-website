
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxe Bags | Login</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px 15px;
    background:
        linear-gradient(rgba(0,0,0,.2), rgba(0,0,0,.4)),
        url("cd.png") center center / cover no-repeat fixed;
    color: white;
}

.brand {
    text-align: center;
    color: #e5b678;
    margin-bottom: 22px;
    text-shadow: 0 2px 12px #000;
}

.brand .icon {
    font-size: 36px;
}

.brand h1 {
    font: normal clamp(38px, 5vw, 65px) Georgia, serif;
    letter-spacing: 5px;
}

.brand h2 {
    font-size: 11px;
    letter-spacing: 4px;
    font-weight: normal;
    margin-top: 7px;
}

.tagline {
    margin-top: 12px;
    font: italic 17px Georgia, serif;
}

.box {
    width: 100%;
    max-width: 400px;
    padding: 30px 32px;
    background: rgba(12, 10, 8, .94);
    border: 1px solid #c89b5b;
    border-radius: 14px;
    box-shadow: 0 5px 35px rgba(0,0,0,.6);
}

.box h3 {
    text-align: center;
    font: normal 24px Georgia, serif;
    color: #e5b678;
    margin-bottom: 25px;
}

label {
    display: block;
    font-size: 12px;
    letter-spacing: 1px;
    color: #e5c18b;
    margin-bottom: 8px;
}

input[type="email"],
input[type="password"] {
    width: 100%;
    height: 42px;
    padding: 10px 12px;
    margin-bottom: 20px;
    border: 1px solid #806747;
    border-radius: 6px;
    background: #f5eee5;
    color: #222;
    font-size: 14px;
}

button {
    cursor: pointer;
}

.primary,
.google {
    width: 100%;
    height: 43px;
    border: 0;
    border-radius: 7px;
    font-size: 15px;
    font-weight: bold;
}

.primary {
    background: linear-gradient(90deg, #b18a35, #f0d78b);
    color: #17110a;
}

.primary:hover {
    background: #fff0b5;
}

.forgot {
    display: block;
    text-align: right;
    color: #e5b678;
    font-size: 13px;
    text-decoration: none;
    margin: 16px 0 25px;
}

.divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #aaa;
    font-size: 12px;
    margin-bottom: 20px;
}

.divider::before,
.divider::after {
    content: "";
    height: 1px;
    background: #615244;
    flex: 1;
}

.google {
    background: white;
    color: #222;
    margin-bottom: 24px;
}

.google span {
    color: #4285f4;
    font-size: 17px;
}

.bottom {
    text-align: center;
    color: #ddd;
    font-size: 13px;
}

.bottom a {
    color: #e5b678;
    text-decoration: none;
    font-weight: bold;
    margin-left: 4px;
}

.message {
    text-align: center;
    color: #f0d78b;
    font-size: 13px;
    margin: 12px 0;
}

@media (max-width: 500px) {
    .box {
        padding: 25px 22px;
    }

    .brand h1 {
        font-size: 36px;
        letter-spacing: 3px;
    }

    .brand h2 {
        letter-spacing: 2px;
    }

    body {
        background-attachment: scroll;
    }
}
</style>
</head>

<body>

<header class="brand">
    <div class="icon">♧</div>
    <h1>LUXE BAGS</h1>
    <h2>LUXURY HANDBAGS COLLECTION</h2>
    <div class="tagline">— More Than Just a Bag —</div>
</header>

<main class="box">
    <h3>Welcome to Luxe Bags</h3>

    <form id="loginForm">
        <label for="email">EMAIL</label>
        <input
            id="email"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label for="password">PASSWORD</label>
        <input
            id="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button class="primary" type="submit">LOGIN</button>
    </form>

    <a class="forgot" href="reset_password.html">
        Forgot Password?
    </a>

    <div class="divider">OR</div>

    <button class="google" id="googleBtn" type="button">
        <span>G</span> &nbsp; Continue with Google
    </button>

    <p id="message" class="message"></p>

    <p class="bottom">
        Don't have an account?
        <a href="https://jumanalawneh.github.io/luxe-bags/signup.html">
            Sign Up
        </a>
    </p>
</main>

<script>
const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");

loginForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const email = document.getElementById("email")
        .value.trim().toLowerCase();

    const password = document.getElementById("password").value;

    const savedEmail = (
        localStorage.getItem("userEmail") ||
        localStorage.getItem("email") ||
        ""
    ).trim().toLowerCase();

    const savedPassword =
        localStorage.getItem("userPassword") ||
        localStorage.getItem("password") ||
        "";

    if (!savedEmail || !savedPassword) {
        message.textContent =
            "Please create an account first using Sign Up.";
        return;
    }

    if (email === savedEmail && password === savedPassword) {
        localStorage.setItem("loggedIn", "true");

        message.textContent = "Login successful!";

        window.location.href =
            "https://jumanalawneh.github.io/luxe-bags/home.html";
    } else {
        message.textContent =
            "Incorrect email or password. Please try again.";
    }
});

document.getElementById("googleBtn").addEventListener("click", function() {
    message.textContent =
        "Google sign-in needs Google Identity Services setup.";
});
</script>

</body>
</html>
