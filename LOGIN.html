
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE BAGS | Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #f4d2a5;

            background-image: url("cd.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #100b08;
        }

        .Welcome {
            position: absolute;
            left: 50%;
            top: 65%;
            transform: translate(-50%, 0);

            width: 260px;
            padding: 14px 18px;

            background: rgba(12, 9, 7, 0.55);
            border: 1px solid rgba(218, 173, 112, 0.65);
            border-radius: 9px;

            backdrop-filter: blur(3px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        /* The brand name is already part of cd.png */
        .Welcome h1 {
            display: none;
        }

        .Welcome form {
            margin: 0;
        }

        .Welcome label {
            display: block;
            margin-top: 8px;
            margin-bottom: 4px;
            font-size: 12px;
            color: #e8c69b;
        }

        .Welcome input[type="email"],
        .Welcome input[type="password"] {
            display: block;
            width: 100%;
            padding: 9px 10px;
            margin-bottom: 7px;

            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(218, 173, 112, 0.45);
            border-radius: 5px;

            color: white;
            font-size: 12px;
            outline: none;
        }

        .Welcome input::placeholder {
            color: #c6b7a7;
        }

        .Welcome input:focus {
            border-color: #e4b875;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 8px 0;
            font-size: 11px;
            color: #ead7c0;
        }

        .remember input {
            accent-color: #c69a60;
        }

        .Welcome button {
            width: 100%;
            padding: 9px;
            margin-top: 5px;

            background: linear-gradient(135deg, #e6c18b, #b78349);
            color: #17100a;

            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .Welcome button:hover {
            background: #f0d4a8;
        }

        .links {
            margin-top: 10px;
            text-align: center;
            font-size: 11px;
            line-height: 1.8;
        }

        .links a {
            color: #e8c18c;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .message {
            min-height: 14px;
            margin-top: 7px;
            font-size: 11px;
            text-align: center;
            color: #f4d2a5;
        }

        .google-login {
            margin-top: 8px;
            display: flex;
            justify-content: center;
        }

        @media (max-width: 600px) {
            body {
                background-position: center;
                background-attachment: scroll;
            }

            .Welcome {
                top: 62%;
                width: 230px;
                padding: 10px 13px;
            }
        }

        @media (max-height: 600px) {
            .Welcome {
                top: 52%;
                padding: 9px 13px;
            }
        }
    </style>

    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

    <section class="Welcome">
        <h1>Welcome to Luxe Bags</h1>

        <form id="loginForm">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <label class="remember">
                <input type="checkbox" id="remember">
                Remember my email
            </label>

            <button type="submit">LOGIN</button>

            <div class="message" id="message"></div>
        </form>

        <div class="links">
            <a href="reset_password.html">Forgot Password?</a>
            <br>
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </div>

        <!-- Google Sign-In Button -->
        <div class="google-login">
            <div
                id="g_id_onload"
                data-client_id="504073574513-j2iv467ha2uka1uqucs16e8f88dck7r7.apps.googleusercontent.com"
                data-callback="handleCredentialResponse">
            </div>

            <div
                class="g_id_signin"
                data-type="standard"
                data-size="medium"
                data-theme="filled_black"
                data-shape="rectangular"
                data-text="signin_with">
            </div>
        </div>
    </section>

    <script>
        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const rememberInput = document.getElementById("remember");
        const message = document.getElementById("message");

        // Restore remembered email
        const savedEmail = localStorage.getItem("rememberedEmail");

        if (savedEmail) {
            emailInput.value = savedEmail;
            rememberInput.checked = true;
        }

        // Email and password login
        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            const registeredEmail = localStorage.getItem("email");
            const registeredPassword = localStorage.getItem("password");

            if (
                registeredEmail &&
                registeredPassword &&
                email === registeredEmail &&
                password === registeredPassword
            ) {
                if (rememberInput.checked) {
                    localStorage.setItem("rememberedEmail", email);
                } else {
                    localStorage.removeItem("rememberedEmail");
                }

                window.location.href = "home.html";
            } else {
                message.textContent =
                    "Invalid email or password. Please sign up first if needed.";
            }
        });

        // Google Sign-In callback
        function handleCredentialResponse(response) {
            if (response && response.credential) {
                alert(
                    "Google sign-in needs server-side verification before login."
                );
            }
        }
    </script>

</body>
</html>
