          content="Discover elegant handbags from iconic luxury brands at Luxe Bags.">

          content="https://jumanalawneh.github.io/luxe-bags/">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T62TQDREQV"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);

        gtag('js', new Date());
        gtag('config', 'G-T62TQDREQV');

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            user-select: none;
            display: flex;
            margin: 0;
            padding: 15px;
            font-family: Arial, sans-serif;
            background-image: url("background%20(2).jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
        }

        .Welcome {
            text-align: center;
            color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(205, 133, 207, 0.8);
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            min-height: 500px;
            height: auto;
            padding: 25px 20px;
        }

        .Welcome h1 {
            margin: 0 0 10px;
        }

        .Welcome input {
            width: 100%;
            max-width: 480px;
            height: 35px;
            padding: 8px;
            box-sizing: border-box;
        }

        .remember {
            width: 100%;
            max-width: 480px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .remember input {
            width: 15px;
            height: 15px;
            margin: 0 5px 0 0;
        }

        .Welcome > button {
            background-color: rgb(252, 252, 252);
            color: rgb(0, 0, 0);
            border: none;
            border-radius: 8px;
            padding: 12px 25px;
            cursor: pointer;
            margin-top: 10px;
        }

        .forgot {
            width: 100%;
            max-width: 480px;
            text-align: left;
            overflow-wrap: break-word;
        }

        .Google {
            max-width: 100%;
            margin-top: 5px;
        }

        .signup-link {
            width: 100%;
            max-width: 480px;
            text-align: center;
            margin: 15px 0 0;
            overflow-wrap: break-word;
        }

        @media (max-width: 400px) {
            .Welcome {
                padding: 20px 15px;
            }

            .Welcome h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="Welcome">

        <h1>Welcome to Luxe Bags</h1>

        <p>EMAIL</p>
        <input id="loginEmail" type="email" name="email"
               placeholder="Enter your email">

        <p>PASSWORD</p>
        <input id="loginPassword" type="password" name="password"
               placeholder="Enter your password">

        <button id="loginButton">Login</button>

        <p class="remember">
            <input type="checkbox" name="remember">
            Remember me
        </p>

        <p class="forgot">
            Forgot your password?
            <a href="reset_password.html">Reset Password</a>
        </p>

        <div class="Google">
            <div id="g_id_onload"
                 data-client_id="504073574513-j2iv467ha2uka1uqucs16e8f88dck7r7.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse">
            </div>

            <div class="g_id_signin" data-type="standard"></div>
        </div>

        <p class="signup-link">
            Don't have an account?
            <a href="signup.html">Sign up</a>
        </p>

    </div>

    <script>
        const loginEmail = document.getElementById("loginEmail");
        const loginPassword = document.getElementById("loginPassword");
        const loginButton = document.getElementById("loginButton");

        loginButton.addEventListener("click", function () {
            const savedEmail = localStorage.getItem("email");
            const savedPassword = localStorage.getItem("password");

            if (
                loginEmail.value === savedEmail &&
                loginPassword.value === savedPassword &&
                savedEmail !== null
            ) {
                window.location.href = "home.html";
            } else {
                alert("Incorrect email or password.");
            }
        });

        function handleCredentialResponse(response) {
            window.location.href = "home.html";
        }
    </script>

</body>
</html>
