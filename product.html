
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bag Details | Luxe Bags</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0b0b;color:white;font-family:Arial,sans-serif}
header{padding:22px 7%;border-bottom:1px solid #393023}
.logo{color:#d4af63;font-family:Georgia,serif;font-size:27px;letter-spacing:3px;text-decoration:none}
.back{display:inline-block;color:#d4af63;margin:25px 7%;text-decoration:none}
.details{display:grid;grid-template-columns:1fr 1fr;gap:50px;max-width:1100px;margin:20px auto 70px;padding:0 25px;align-items:center}
.image-box{background:#171717;border:1px solid #393023}
.image-box img{display:block;width:100%;height:520px;object-fit:cover}
.eyebrow{color:#d4af63;letter-spacing:3px;font-size:12px;margin-bottom:20px}
h1{font-family:Georgia,serif;font-size:clamp(32px,4vw,48px);font-weight:normal;line-height:1.2;margin-bottom:20px}
.price{color:#d4af63;font-size:25px;margin-bottom:25px}
.description{color:#c7c2b9;line-height:1.9;margin-bottom:25px}
.note{color:#a9a39a;font-size:13px;line-height:1.7;margin-bottom:25px}
.add-button{width:100%;padding:16px;border:1px solid #d4af63;background:#d4af63;color:#111;font-weight:bold;cursor:pointer;transition:.2s}
.add-button:hover{background:transparent;color:#d4af63}
footer{text-align:center;padding:25px;border-top:1px solid #393023;color:#aaa;font-size:13px;line-height:2}
footer span{color:#d4af63}
@media(max-width:700px){.details{grid-template-columns:1fr;gap:30px}.image-box img{height:350px}}
</style>
</head>

<body>
<header>
<a class="logo" href="home.html">LUXE BAGS</a>
</header>

<a class="back" href="home.html#shop">← Back to Collection</a>

<main class="details">
<div class="image-box">
<img id="bagImage" src="" alt="Handbag">
</div>

<section>
<p class="eyebrow" id="bagBrand">LUXE BAGS COLLECTION</p>
<h1 id="bagName">Loading...</h1>
<p class="price" id="bagPrice"></p>
<p class="description" id="bagDescription"></p>

<p class="note">
Prices and descriptions are examples for this demo store.
These are style-inspired designs, not official brand listings.
</p>

<button class="add-button" id="addButton">ADD TO BAG</button>
</section>
</main>

<footer>
<p><span>LUXE BAGS</span> — Timeless elegance.</p>
<p>Demo store · © 2026 Luxe Bags</p>
</footer>

<script>
const bags = {
    classic: {
        name: "Classic Handbag",
        brand: "TIMELESS COLLECTION",
        price: 120,
        image: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=1000&q=85",
        description: "A timeless handbag with an elegant silhouette, perfect for everyday outfits and special occasions."
    },
    hobo: {
        name: "Crescent Hobo",
        brand: "MODERN CLASSICS",
        price: 125,
        image: "https://images.unsplash.com/photo-1548036328-c9fa89d128fa?auto=format&fit=crop&w=1000&q=85",
        description: "A relaxed crescent-shaped shoulder bag that brings effortless style to your everyday look."
    },
    baguette: {
        name: "Baguette Bag",
        brand: "CITY EDITION",
        price: 115,
        image: "https://images.unsplash.com/photo-1591561954557-26941169b49e?auto=format&fit=crop&w=1000&q=85",
        description: "A compact underarm bag with a chic shape, ideal for outings and city style."
    },
    bucket: {
        name: "Bucket Bag",
        brand: "EVERYDAY LUXURY",
        price: 130,
        image: "https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&w=1000&q=85",
        description: "A roomy bucket-style handbag that combines a distinctive silhouette with everyday practicality."
    },
    mini: {
        name: "Mini Top Handle",
        brand: "THE MINI EDIT",
        price: 95,
        image: "https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?auto=format&fit=crop&w=1000&q=85",
        description: "A mini handbag for carrying your essentials in a small, elegant design."
    },
    clutch: {
        name: "Evening Clutch",
        brand: "EVENING COLLECTION",
        price: 175,
        image: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=1000&q=85",
        description: "An elegant clutch-style bag for dinners, celebrations, and special occasions."
    },
    slouchy: {
        name: "Slouchy Shoulder Bag",
        brand: "EFFORTLESS STYLE",
        price: 145,
        image: "https://images.unsplash.com/photo-1548036328-c9fa89d128fa?auto=format&fit=crop&w=1000&q=85",
        description: "A generously sized, relaxed shoulder bag for an effortless and modern look."
    },
    saddle: {
        name: "Saddle Crossbody",
        brand: "SIGNATURE SHAPES",
        price: 135,
        image: "https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&w=1000&q=85",
        description: "A curved saddle-shaped crossbody bag that adds a distinctive touch to everyday outfits."
    }
};

const params = new URLSearchParams(window.location.search);
const item = params.get("item") || "classic";
const bag = bags[item] || bags.classic;

document.title = bag.name + " | Luxe Bags";
document.getElementById("bagName").textContent = bag.name;
document.getElementById("bagBrand").textContent = bag.brand;
document.getElementById("bagPrice").textContent = "$" + bag.price.toFixed(2);
document.getElementById("bagImage").src = bag.image;
document.getElementById("bagImage").alt = bag.name;
document.getElementById("bagDescription").textContent = bag.description;

document.getElementById("addButton").addEventListener("click", function() {
    const cart = JSON.parse(localStorage.getItem("luxeCart") || "[]");

    cart.push({
        name: bag.name,
        price: bag.price,
        item: item
    });

    localStorage.setItem("luxeCart", JSON.stringify(cart));
    this.textContent = "ADDED TO BAG ✓";
});
</script>
</body>
</html>
