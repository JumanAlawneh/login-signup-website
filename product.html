
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handbag Details | Luxe Bags</title>
<meta name="description" content="Explore luxury handbags at Luxe Bags.">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --gold: #d4af37;
    --black: #090909;
    --card: #151515;
    --white: #f8f5ed;
}

body {
    min-height: 100vh;
    background: var(--black);
    color: var(--white);
    font-family: Arial, sans-serif;
}

header {
    padding: 22px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
    border-bottom: 1px solid #40341b;
}

.logo {
    color: var(--gold);
    font-family: Georgia, serif;
    font-size: 30px;
    letter-spacing: 3px;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 22px;
}

nav a {
    color: var(--white);
    text-decoration: none;
}

nav a:hover {
    color: var(--gold);
}

.details {
    width: min(1100px, 90%);
    margin: 60px auto;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 45px;
    align-items: center;
}

.image-panel {
    background: var(--card);
    border: 1px solid #40341b;
    padding: 15px;
}

.image-panel img {
    width: 100%;
    height: 470px;
    display: block;
    object-fit: contain;
    object-position: center;
    background: #181818;
}

.info h1 {
    color: var(--gold);
    font-family: Georgia, serif;
    font-size: clamp(30px, 4vw, 45px);
    margin-bottom: 18px;
}

.price {
    color: var(--gold);
    font-size: 28px;
    margin-bottom: 25px;
}

.description {
    color: #ccc;
    line-height: 1.8;
    margin-bottom: 25px;
}

.info label {
    display: block;
    margin-bottom: 10px;
}

.info input {
    width: 100px;
    padding: 12px;
    margin-bottom: 22px;
    background: #171717;
    border: 1px solid #51421c;
    color: white;
}

.gold-button {
    display: inline-block;
    padding: 14px 22px;
    background: var(--gold);
    color: #090909;
    border: none;
    font-weight: bold;
    text-decoration: none;
    cursor: pointer;
}

.gold-button:hover {
    background: #f0d779;
}

.secondary-button {
    margin-left: 8px;
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
}

.message {
    color: var(--gold);
    margin-top: 18px;
    min-height: 24px;
    line-height: 1.6;
}

.back-link {
    display: inline-block;
    margin-top: 25px;
    color: #ccc;
    text-decoration: none;
}

.back-link:hover {
    color: var(--gold);
}

.not-found {
    text-align: center;
    padding: 100px 20px;
}

footer {
    text-align: center;
    padding: 28px 15px;
    color: #aaa;
    border-top: 1px solid #40341b;
}

footer span {
    color: var(--gold);
}

@media (max-width: 750px) {
    .details {
        grid-template-columns: 1fr;
        gap: 25px;
        margin: 35px auto;
    }

    .image-panel img {
        height: 350px;
    }

    header {
        justify-content: center;
    }

    .logo {
        font-size: 25px;
    }

    nav {
        justify-content: center;
    }

    .secondary-button {
        margin: 10px 0 0;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">LUXE BAGS</div>

    <nav>
        <a href="./home.html">Home</a>
        <a href="./home.html#collection">Collection</a>
    </nav>
</header>

<main id="productContent"></main>

<footer>
    <p>© 2026 <span>Luxe Bags</span>. All rights reserved.</p>
</footer>

<script>
const bags = [
    {
        id: "gucci",
        name: "Gucci Monogram Shoulder Bag",
        price: 250,
        image: "./GUCCI.PNG",
        description: "A sophisticated monogram shoulder bag with classic brown details."
    },
    {
        id: "gucci1",
        name: "Gucci Classic Shoulder Bag",
        price: 270,
        image: "./GUCCI1.PNG",
        description: "An elegant designer-inspired shoulder bag for a polished look."
    },
    {
        id: "chanel",
        name: "Chanel Quilted Handbag",
        price: 280,
        image: "./CHANEL.PNG",
        description: "A timeless quilted handbag with a refined chain-strap design."
    },
    {
        id: "dior",
        name: "Dior Classic Handbag",
        price: 275,
        image: "./DIOR.PNG",
        description: "A structured handbag with a graceful silhouette and sophisticated style."
    },
    {
        id: "dior1",
        name: "Dior Saddle Style Bag",
        price: 285,
        image: "./DIOR1.PNG",
        description: "A distinctive designer-style bag for a statement outfit."
    },
    {
        id: "ysl",
        name: "YSL Quilted Shoulder Bag",
        price: 260,
        image: "./YSL.PNG",
        description: "A sleek shoulder bag with a quilted finish and elegant hardware."
    },
    {
        id: "ysl1",
        name: "YSL Burgundy Shoulder Bag",
        price: 265,
        image: "./YSL1.PNG",
        description: "A rich burgundy shoulder bag that adds a bold touch of color."
    },
    {
        id: "prada",
        name: "Prada Classic Tote",
        price: 240,
        image: "./PRADA.PNG",
        description: "A minimalist tote with a clean shape and versatile style."
    },
    {
        id: "lv",
        name: "Louis Vuitton Monogram Bag",
        price: 300,
        image: "./LV.PNG",
        description: "A monogram handbag with a recognizable pattern and classic styling."
    },
    {
        id: "mk",
        name: "Michael Kors Signature Bag",
        price: 190,
        image: "./MK.PNG",
        description: "A versatile signature handbag designed to complement everyday outfits."
    }
];

const params = new URLSearchParams(window.location.search);
const itemId = params.get("bag");
const bag = bags.find(item => item.id === itemId);
const content = document.getElementById("productContent");

if (!bag) {
    content.innerHTML = `
        <section class="not-found">
            <h1>Handbag Not Found</h1>
            <p style="margin:18px 0;color:#ccc">
                Please select a handbag from our collection.
            </p>
            <a class="gold-button" href="./home.html#collection">
                Back to Collection
            </a>
        </section>
    `;
} else {
    const section = document.createElement("section");
    section.className = "details";

    const imagePanel = document.createElement("div");
    imagePanel.className = "image-panel";

    const image = document.createElement("img");
    image.src = bag.image;
    image.alt = bag.name;

    image.onerror = function () {
        this.onerror = null;
        this.style.display = "none";

        const errorMessage = document.createElement("p");
        errorMessage.textContent =
            "Image could not be loaded. Please check the image filename.";
        errorMessage.style.cssText =
            "padding:30px;color:#ccc;line-height:1.6";
        imagePanel.appendChild(errorMessage);
    };

    imagePanel.appendChild(image);

    const info = document.createElement("div");
    info.className = "info";

    const title = document.createElement("h1");
    title.textContent = bag.name;

    const price = document.createElement("p");
    price.className = "price";
    price.textContent = "$" + bag.price.toFixed(2);

    const description = document.createElement("p");
    description.className = "description";
    description.textContent = bag.description;

    const quantityLabel = document.createElement("label");
    quantityLabel.htmlFor = "quantity";
    quantityLabel.textContent = "Quantity";

    const quantityInput = document.createElement("input");
    quantityInput.type = "number";
    quantityInput.id = "quantity";
    quantityInput.min = "1";
    quantityInput.max = "99";
    quantityInput.step = "1";
    quantityInput.value = "1";

    const addButton = document.createElement("button");
    addButton.className = "gold-button";
    addButton.textContent = "Add to Bag";

    const favoriteButton = document.createElement("button");
    favoriteButton.className = "gold-button secondary-button";

    const message = document.createElement("p");
    message.className = "message";
    message.setAttribute("aria-live", "polite");

    const backLink = document.createElement("a");
    backLink.className = "back-link";
    backLink.href = "./home.html#collection";
    backLink.textContent = "← Back to Collection";

    info.append(
        title,
        price,
        description,
        quantityLabel,
        quantityInput,
        addButton,
        favoriteButton,
        message,
        backLink
    );

    section.append(imagePanel, info);
    content.appendChild(section);

    function getStoredArray(key) {
        try {
            const value = JSON.parse(localStorage.getItem(key));
            return Array.isArray(value) ? value : [];
        } catch {
            return [];
        }
    }

    function updateFavoriteButton() {
        const favorites = getStoredArray("luxeFavorites");
        favoriteButton.textContent =
            favorites.includes(bag.id) ? "♥ Favorited" : "♡ Favorite";
    }

    favoriteButton.addEventListener("click", () => {
        const favorites = getStoredArray("luxeFavorites");
        const index = favorites.indexOf(bag.id);

        if (index === -1) {
            favorites.push(bag.id);
        } else {
            favorites.splice(index, 1);
        }

        try {
            localStorage.setItem("luxeFavorites", JSON.stringify(favorites));
            updateFavoriteButton();

            message.textContent = favorites.includes(bag.id)
                ? "Added to your favorites!"
                : "Removed from your favorites.";
        } catch {
            message.textContent =
                "Unable to save favorites in this browser.";
        }
    });

    addButton.addEventListener("click", () => {
        const quantity = Number(quantityInput.value);

        if (!Number.isInteger(quantity) || quantity < 1 || quantity > 99) {
            message.textContent = "Enter a quantity between 1 and 99.";
            return;
        }

        const cart = getStoredArray("luxeCart");
        const existingItem = cart.find(item => item.id === bag.id);

        if (existingItem) {
            existingItem.quantity += quantity;
        } else {
            cart.push({
                id: bag.id,
                name: bag.name,
                price: bag.price,
                image: bag.image,
                quantity: quantity
            });
        }

        try {
            localStorage.setItem("luxeCart", JSON.stringify(cart));
            message.textContent =
                quantity + " × " + bag.name + " added to your bag!";
        } catch {
            message.textContent =
                "Unable to save your bag in this browser.";
        }
    });

    updateFavoriteButton();
}
</script>

</body>
</html>
