
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxe Bags | Luxury Collection</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --gold: #d4af37;
    --black: #090909;
    --card: #151515;
    --white: #f8f5ed;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--black);
    color: var(--white);
    font-family: Arial, sans-serif;
}

header {
    padding: 22px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
    border-bottom: 1px solid #40341b;
}

.logo {
    color: var(--gold);
    font-family: Georgia, serif;
    font-size: 30px;
    letter-spacing: 3px;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 22px;
}

nav a {
    color: var(--white);
    text-decoration: none;
    transition: color 0.2s;
}

nav a:hover {
    color: var(--gold);
}

.hero {
    min-height: 420px;
    padding: 70px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;

    background:
        linear-gradient(#0009, #000b),
        url("./background%20%282%29.jpg") center/cover no-repeat,
        #17130b;
}

.hero h1 {
    color: var(--gold);
    font-family: Georgia, serif;
    font-size: clamp(38px, 6vw, 65px);
    margin-bottom: 20px;
}

.hero p {
    color: #eee;
    font-size: 17px;
    margin-bottom: 28px;
}

.gold-button {
    display: inline-block;
    padding: 13px 23px;
    background: var(--gold);
    color: #090909;
    border: none;
    font-weight: bold;
    text-decoration: none;
    cursor: pointer;
    transition: 0.2s;
}

.gold-button:hover {
    background: #f0d779;
    transform: translateY(-2px);
}

.collection {
    padding: 55px 7%;
}

.section-title {
    text-align: center;
    color: var(--gold);
    font-family: Georgia, serif;
    font-size: 36px;
    margin-bottom: 12px;
}

.section-subtitle {
    color: #aaa;
    text-align: center;
    margin-bottom: 30px;
}

.search-box {
    display: block;
    width: min(100%, 450px);
    margin: 0 auto 35px;
    padding: 14px 16px;
    background: #171717;
    color: white;
    border: 1px solid #51421c;
    outline: none;
}

.search-box:focus {
    border-color: var(--gold);
}

.products {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(220px, 1fr)
    );
    gap: 25px;
}

.product-card {
    background: var(--card);
    border: 1px solid #29251a;
    padding: 15px;
    transition: 0.25s;
}

.product-card:hover {
    border-color: var(--gold);
    transform: translateY(-5px);
}

.product-card img {
    width: 100%;
    height: 260px;
    display: block;
    object-fit: contain;
    background: #202020;
}

.product-name {
    color: var(--white);
    font-family: Georgia, serif;
    font-size: 19px;
    margin: 17px 0 10px;
}

.price {
    color: var(--gold);
    font-size: 19px;
    margin-bottom: 15px;
}

.card-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

.card-actions .gold-button {
    flex: 1;
    text-align: center;
    padding: 11px 6px;
}

.favorite {
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 9px 12px;
    font-size: 21px;
    cursor: pointer;
}

.favorite.active {
    background: var(--gold);
    color: black;
}

.empty-message {
    grid-column: 1 / -1;
    text-align: center;
    color: #aaa;
    padding: 30px;
}

footer {
    padding: 28px 15px;
    text-align: center;
    border-top: 1px solid #40341b;
    color: #aaa;
}

footer span {
    color: var(--gold);
}

@media (max-width: 500px) {
    header {
        justify-content: center;
    }

    .logo {
        font-size: 25px;
    }

    nav {
        justify-content: center;
    }

    .collection {
        padding: 40px 5%;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">LUXE BAGS</div>

    <nav>
        <a href="home.html">Home</a>
        <a href="#collection">Collection</a>
        <a href="#footer">Contact</a>
    </nav>
</header>

<section class="hero">
    <h1>Elegance in Every Detail</h1>
    <p>Discover your next favorite luxury handbag.</p>
    <a href="#collection" class="gold-button">
        EXPLORE COLLECTION
    </a>
</section>

<section class="collection" id="collection">
    <h2 class="section-title">Our Collection</h2>
    <p class="section-subtitle">
        Timeless designs. Elegant details. Everyday luxury.
    </p>

    <input
        type="search"
        id="searchInput"
        class="search-box"
        placeholder="Search for a handbag..."
        aria-label="Search handbags"
    >

    <div class="products" id="products"></div>
</section>

<footer id="footer">
    <p>© 2026 <span>Luxe Bags</span>. All rights reserved.</p>
</footer>

<script>
const bags = [
    {
        id: "classic-top-handle-handbag",
        name: "Classic Top Handle",
        price: 120,
        image: "./Classic%20Top%20Handle.jpg",
        description: "A timeless handbag with an elegant top handle."
    },
    {
        id: "crescent-hobo-shoulder-bag",
        name: "Crescent Hobo",
        price: 115,
        image: "./Crescent%20Hobo.jpg",
        description: "A chic crescent-shaped shoulder bag."
    },
    {
        id: "baguette-underarm-bag",
        name: "Baguette Bag",
        price: 98,
        image: "./Baguette%20Bag.jpg",
        description: "A stylish compact bag for everyday looks."
    },
    {
        id: "leather-bucket-drawstring-bag",
        name: "Leather Bucket",
        price: 130,
        image: "./Leather%20Bucket.jpg",
        description: "A modern bucket bag with a sophisticated design."
    },
    {
        id: "mini-top-handle-handbag",
        name: "Mini Top Handle",
        price: 89,
        image: "./Mini%20Top%20Handle.jpg",
        description: "A mini handbag for elegant occasions."
    },
    {
        id: "elegant-evening-clutch-bag",
        name: "Evening Clutch",
        price: 105,
        image: "./Evening%20Clutch.jpg",
        description: "An elegant clutch for evening outings."
    },
    {
        id: "oversized-slouchy-shoulder-bag",
        name: "Slouchy Shoulder",
        price: 145,
        image: "./Slouchy%20Shoulder.jpg",
        description: "A spacious shoulder bag with a relaxed style."
    },
    {
        id: "saddle-curved-flap-crossbody-bag",
        name: "Saddle Crossbody",
        price: 125,
        image: "./Saddle%20Crossbody.jpg",
        description: "A classic saddle-inspired crossbody bag."
    }
];

const productsContainer = document.getElementById("products");
const searchInput = document.getElementById("searchInput");

function getFavorites() {
    try {
        return JSON.parse(
            localStorage.getItem("luxeFavorites")
        ) || [];
    } catch {
        return [];
    }
}

function toggleFavorite(id) {
    const favorites = getFavorites();
    const index = favorites.indexOf(id);

    if (index === -1) {
        favorites.push(id);
    } else {
        favorites.splice(index, 1);
    }

    localStorage.setItem(
        "luxeFavorites",
        JSON.stringify(favorites)
    );

    renderBags(searchInput.value);
}

function renderBags(searchText = "") {
    productsContainer.innerHTML = "";

    const filteredBags = bags.filter(bag =>
        bag.name.toLowerCase().includes(
            searchText.toLowerCase().trim()
        )
    );

    if (filteredBags.length === 0) {
        productsContainer.innerHTML =
            '<p class="empty-message">No handbags found.</p>';
        return;
    }

    const favorites = getFavorites();

    filteredBags.forEach(bag => {
        const card = document.createElement("article");
        card.className = "product-card";

        const image = document.createElement("img");
        image.src = bag.image;
        image.alt = bag.name;
        image.loading = "lazy";

        image.onerror = function () {
            this.alt = bag.name + " image could not be loaded";
            this.style.objectFit = "contain";
            this.style.border = "1px solid #d4af37";
        };

        const name = document.createElement("h3");
        name.className = "product-name";
        name.textContent = bag.name;

        const price = document.createElement("p");
        price.className = "price";
        price.textContent = "$" + bag.price.toFixed(2);

        const actions = document.createElement("div");
        actions.className = "card-actions";

        const viewButton = document.createElement("a");
        viewButton.className = "gold-button";
        viewButton.href =
            "product.html?item=" + encodeURIComponent(bag.id);
        viewButton.textContent = "View Details";

        const favoriteButton = document.createElement("button");
        favoriteButton.className =
            "favorite" +
            (favorites.includes(bag.id) ? " active" : "");

        favoriteButton.textContent =
            favorites.includes(bag.id) ? "♥" : "♡";

        favoriteButton.setAttribute(
            "aria-label",
            "Toggle favorite for " + bag.name
        );

        favoriteButton.addEventListener("click", () => {
            toggleFavorite(bag.id);
        });

        actions.append(viewButton, favoriteButton);
        card.append(image, name, price, actions);
        productsContainer.appendChild(card);
    });
}

searchInput.addEventListener("input", event => {
    renderBags(event.target.value);
});

renderBags();
</script>

</body>
</html>
