<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxe Bags | Luxury Collection</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --gold: #d4af37;
    --black: #090909;
    --card: #151515;
    --white: #f8f5ed;
}

body {
    background: var(--black);
    color: var(--white);
    font-family: Arial, sans-serif;
}

header {
    padding: 25px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    border-bottom: 1px solid #3b3018;
}

.logo {
    color: var(--gold);
    font-family: Georgia, serif;
    font-size: 30px;
    letter-spacing: 3px;
}

nav {
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
}

nav a {
    color: var(--white);
    text-decoration: none;
}

nav a:hover {
    color: var(--gold);
}

.hero {
    min-height: 380px;
    padding: 70px 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background:
        linear-gradient(#0009, #000b),
        url("luxe-bags-background.png") center/cover no-repeat,
        #17130b;
}

.hero h1 {
    font-family: Georgia, serif;
    font-size: clamp(38px, 6vw, 65px);
    color: var(--gold);
    margin-bottom: 18px;
}

.hero p {
    font-size: 17px;
    color: #eee;
    margin-bottom: 28px;
}

.gold-button {
    display: inline-block;
    background: var(--gold);
    color: #090909;
    border: none;
    padding: 13px 25px;
    font-weight: bold;
    text-decoration: none;
    cursor: pointer;
    transition: 0.2s;
}

.gold-button:hover {
    background: #f0d779;
    transform: translateY(-2px);
}

.collection {
    padding: 55px 7%;
}

.section-title {
    text-align: center;
    font-family: Georgia, serif;
    font-size: 35px;
    color: var(--gold);
    margin-bottom: 12px;
}

.section-subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 30px;
}

.search-box {
    display: block;
    width: min(100%, 450px);
    margin: 0 auto 35px;
    padding: 13px 16px;
    background: #171717;
    border: 1px solid #51421c;
    color: white;
    outline: none;
}

.search-box:focus {
    border-color: var(--gold);
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
}

.product-card {
    background: var(--card);
    border: 1px solid #29251a;
    padding: 15px;
    transition: 0.25s;
}

.product-card:hover {
    border-color: var(--gold);
    transform: translateY(-5px);
}

.product-card img {
    display: block;
    width: 100%;
    height: 250px;
    object-fit: cover;
    background: #222;
}

.product-name {
    color: var(--white);
    font-family: Georgia, serif;
    font-size: 19px;
    margin: 17px 0 10px;
}

.price {
    color: var(--gold);
    font-size: 18px;
    margin-bottom: 15px;
}

.card-actions {
    display: flex;
    gap: 10px;
    align-items: center;
}

.card-actions .gold-button {
    flex: 1;
    text-align: center;
    padding: 11px 8px;
}

.favorite {
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 9px 12px;
    font-size: 20px;
    cursor: pointer;
}

.favorite.active {
    background: var(--gold);
    color: black;
}

.empty-message {
    text-align: center;
    color: #aaa;
    grid-column: 1 / -1;
    padding: 30px;
}

footer {
    padding: 28px 15px;
    text-align: center;
    border-top: 1px solid #3b3018;
    color: #aaa;
}

footer span {
    color: var(--gold);
}

@media (max-width: 500px) {
    header {
        justify-content: center;
    }

    .logo {
        font-size: 25px;
    }

    nav {
        justify-content: center;
    }

    .collection {
        padding: 40px 5%;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">LUXE BAGS</div>

    <nav>
        <a href="home.html">Home</a>
        <a href="#collection">Collection</a>
        <a href="#footer">Contact</a>
        <a href="product.html">Shop</a>
    </nav>
</header>

<section class="hero">
    <h1>Elegance in Every Detail</h1>
    <p>Discover your next favorite luxury handbag.</p>
    <a href="#collection" class="gold-button">EXPLORE COLLECTION</a>
</section>

<section class="collection" id="collection">
    <h2 class="section-title">Our Collection</h2>
    <p class="section-subtitle">
        Timeless designs. Elegant details. Everyday luxury.
    </p>

    <input
        class="search-box"
        type="search"
        id="searchInput"
        placeholder="Search for a handbag..."
        aria-label="Search handbags"
    >

    <div class="products" id="products"></div>
</section>

<footer id="footer">
    <p>© 2026 <span>Luxe Bags</span>. All rights reserved.</p>
</footer>

<script>
const bags = [
    {
        id: "classic-top-handle-handbag",
        name: "Classic Top Handle",
        price: 120,
        image: "images/Classic%20Top%20Handle.jpg",
        description: "A timeless handbag with an elegant top handle."
    },
    {
        id: "crescent-hobo-shoulder-bag",
        name: "Crescent Hobo",
        price: 115,
        image: "images/Crescent%20Hobo.jpg",
        description: "A chic crescent-shaped shoulder bag."
    },
    {
        id: "baguette-underarm-bag",
        name: "Baguette Bag",
        price: 98,
        image: "images/Baguette%20Bag.jpg",
        description: "A stylish compact bag for effortless everyday looks."
    },
    {
        id: "leather-bucket-drawstring-bag",
        name: "Leather Bucket",
        price: 130,
        image: "images/Leather%20Bucket.jpg",
        description: "A modern bucket bag with a sophisticated design."
    },
    {
        id: "mini-top-handle-handbag",
        name: "Mini Top Handle",
        price: 89,
        image: "images/Mini%20Top%20Handle.jpg",
        description: "A mini handbag for elegant occasions."
    },
    {
        id: "elegant-evening-clutch-bag",
        name: "Evening Clutch",
        price: 105,
        image: "images/Evening%20Clutch.jpg",
        description: "An elegant clutch designed for evening outings."
    },
    {
        id: "oversized-slouchy-shoulder-bag",
        name: "Slouchy Shoulder",
        price: 145,
        image: "images/Slouchy%20Shoulder.jpg",
        description: "A spacious shoulder bag with a relaxed silhouette."
    },
    {
        id: "saddle-curved-flap-crossbody-bag",
        name: "Saddle Crossbody",
        price: 125,
        image: "images/Saddle%20Crossbody.jpg",
        description: "A classic saddle-inspired crossbody bag."
    }
];

const productsContainer = document.getElementById("products");
const searchInput = document.getElementById("searchInput");

function getFavorites() {
    try {
        return JSON.parse(localStorage.getItem("luxeFavorites")) || [];
    } catch {
        return [];
    }
}

function toggleFavorite(id) {
    const favorites = getFavorites();
    const index = favorites.indexOf(id);

    if (index === -1) {
        favorites.push(id);
    } else {
        favorites.splice(index, 1);
    }

    localStorage.setItem("luxeFavorites", JSON.stringify(favorites));
    renderBags(searchInput.value);
}

function renderBags(searchText = "") {
    productsContainer.innerHTML = "";

    const filteredBags = bags.filter(bag =>
        bag.name.toLowerCase().includes(searchText.toLowerCase())
    );

    if (filteredBags.length === 0) {
        productsContainer.innerHTML =
            '<p class="empty-message">No handbags found.</p>';
        return;
    }

    const favorites = getFavorites();

    filteredBags.forEach(bag => {
        const isFavorite = favorites.includes(bag.id);

        const card = document.createElement("article");
        card.className = "product-card";

        const image = document.createElement("img");
        image.src = bag.image;
        image.alt = bag.name;
        image.loading = "lazy";
        image.onerror = function () {
            this.alt = bag.name + " — image not found";
            this.style.objectFit = "contain";
        };

        const name = document.createElement("h3");
        name.className = "product-name";
        name.textContent = bag.name;

        const price = document.createElement("p");
        price.className = "price";
        price.textContent = "$" + bag.price.toFixed(2);

        const actions = document.createElement("div");
        actions.className = "card-actions";

        const viewButton = document.createElement("a");
        viewButton.className = "gold-button";
        viewButton.href = "product.html?item=" + encodeURIComponent(bag.id);
        viewButton.textContent = "View Details";

        const favoriteButton = document.createElement("button");
        favoriteButton.className =
            "favorite" + (isFavorite ? " active" : "");
        favoriteButton.textContent = isFavorite ? "♥" : "♡";
        favoriteButton.setAttribute(
            "aria-label",
            isFavorite ? "Remove from favorites" : "Add to favorites"
        );
        favoriteButton.addEventListener("click", () => {
            toggleFavorite(bag.id);
        });

        actions.append(viewButton, favoriteButton);
        card.append(image, name, price, actions);
        productsContainer.appendChild(card);
    });
}

searchInput.addEventListener("input", event => {
    renderBags(event.target.value);
});

renderBags();
</script>

</body>
</html>
